name: Build TikGet APK

on:
  push:
    paths:
      - 'android_tiktok/**'
      - '.github/workflows/build-tikget.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-tikget-${{ runner.os }}-${{ hashFiles('android_tiktok/**/*.gradle*', 'android_tiktok/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-tikget-${{ runner.os }}-

      - name: Ensure system Gradle is available (for wrapper bootstrap)
        run: |
          if ! command -v gradle >/dev/null; then
            GRADLE_VER=8.5
            curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
            sudo unzip -q /tmp/gradle.zip -d /opt
            sudo ln -sf "/opt/gradle-${GRADLE_VER}/bin/gradle" /usr/local/bin/gradle
          fi
          gradle --version

      - name: Generate Gradle wrapper if missing
        working-directory: android_tiktok
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            echo "Wrapper jar/gradlew missing. Generating via system Gradle…"
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          chmod +x gradlew
          ls -la gradle/wrapper gradlew

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storetype PKCS12 \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        working-directory: android_tiktok
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List output APKs
        if: always()
        working-directory: android_tiktok
        run: |
          echo "== app/build/outputs/apk =="
          find app/build/outputs -name '*.apk' -print || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tikget-apk
          path: android_tiktok/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tikget-build-reports
          path: |
            android_tiktok/app/build/reports/
            android_tiktok/build/reports/
          retention-days: 7
          if-no-files-found: ignore
